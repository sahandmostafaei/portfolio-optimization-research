name: Research Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile research source
        run: |
          python -m py_compile src/portfolio_research_reproducibility.py

      - name: Verify required files
        run: |
          test -s README.md
          test -s methodology/research_design.md
          test -s src/portfolio_research_reproducibility.py
          test -s docs/research_integrity.md
          test -s docs/reproducibility.md
          test -s requirements.txt
          test -s CITATION.cff
          test -s LICENSE
